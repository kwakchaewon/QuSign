name: Deploy to AWS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy-backend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'corretto'

      - name: Build JAR
        working-directory: backend
        run: ./gradlew bootJar --no-daemon -x test

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-1

      - uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        working-directory: backend
        run: |
          docker build -t ${{ secrets.ECR_REGISTRY }}/qusign_backend:latest .
          docker push ${{ secrets.ECR_REGISTRY }}/qusign_backend:latest

      - name: Setup SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/ec2.pem
          chmod 600 ~/.ssh/ec2.pem
          printf 'Host *\n  StrictHostKeyChecking no\n  UserKnownHostsFile /dev/null\n' > ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: Copy docker-compose.prod.yml to EC2
        run: |
          scp -i ~/.ssh/ec2.pem docker-compose.prod.yml \
            ec2-user@${{ secrets.EC2_HOST }}:/home/ec2-user/docker-compose.prod.yml

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            ECR_REGISTRY="${{ secrets.ECR_REGISTRY }}"

            DB_PASSWORD=$(aws ssm get-parameter --name /qusign/prod/db-password \
              --with-decryption --query Parameter.Value --output text)
            JWT_SECRET=$(aws ssm get-parameter --name /qusign/prod/jwt-secret \
              --with-decryption --query Parameter.Value --output text)
            S3_BUCKET=$(aws ssm get-parameter --name /qusign/prod/s3-bucket \
              --query Parameter.Value --output text)
            CORS_ORIGINS=$(aws ssm get-parameter --name /qusign/prod/cors-origins \
              --query Parameter.Value --output text)

            cat > /home/ec2-user/.env << ENVEOF
            ECR_REGISTRY=$ECR_REGISTRY
            DB_PASSWORD=$DB_PASSWORD
            JWT_SECRET=$JWT_SECRET
            S3_BUCKET=$S3_BUCKET
            CORS_ORIGINS=$CORS_ORIGINS
            ENVEOF

            aws ecr get-login-password --region ap-southeast-1 | \
              docker login --username AWS --password-stdin "$ECR_REGISTRY"

            docker compose -f /home/ec2-user/docker-compose.prod.yml pull backend
            docker compose -f /home/ec2-user/docker-compose.prod.yml up -d

  deploy-frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build Vue frontend
        working-directory: frontend
        run: npm ci && npm run build-only

      - name: Setup SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/ec2.pem
          chmod 600 ~/.ssh/ec2.pem
          printf 'Host *\n  StrictHostKeyChecking no\n  UserKnownHostsFile /dev/null\n' > ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: Deploy frontend to EC2
        run: |
          ssh -i ~/.ssh/ec2.pem ec2-user@${{ secrets.EC2_HOST }} \
            "sudo mkdir -p /var/www/qusign/dist && sudo chown -R ec2-user:ec2-user /var/www/qusign"
          scp -i ~/.ssh/ec2.pem -r frontend/dist/* \
            ec2-user@${{ secrets.EC2_HOST }}:/var/www/qusign/dist/
